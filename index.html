<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Infinite Stock Chaos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Roboto Mono', 'Courier New', 'monospace'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen overflow-x-hidden selection:bg-emerald-500/30">

  <!-- Scanline overlay -->
  <div class="scanlines pointer-events-none fixed inset-0 z-50"></div>

  <!-- Bankrupt overlay -->
  <div id="bankrupt-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm hidden">
    <div class="text-center px-6 animate-pulse-slow">
      <h2 class="text-5xl sm:text-7xl font-black text-red-500 neon-red tracking-widest mb-4">BANKRUPT</h2>
      <p class="text-gray-400 font-mono text-sm sm:text-base mb-8">Your portfolio has been liquidated to zero.</p>
      <button id="restart-btn" class="px-10 py-4 bg-red-600 hover:bg-red-500 text-white font-bold text-lg rounded-lg border border-red-400/50 shadow-[0_0_30px_rgba(239,68,68,0.4)] transition-all hover:scale-105 active:scale-95">
        RESTART
      </button>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-3 sm:px-6 py-4 sm:py-6 flex flex-col min-h-screen gap-3 sm:gap-4">

    <!-- Header -->
    <header class="flex items-center justify-between">
      <div>
        <h1 class="text-lg sm:text-2xl font-black tracking-tight">
          <span class="text-emerald-400">INFINITE</span>
          <span class="text-white"> STOCK </span>
          <span class="text-red-400">CHAOS</span>
        </h1>
        <p class="text-[10px] sm:text-xs text-gray-500 font-mono tracking-widest uppercase">Satirical Trading Simulator</p>
      </div>
      <div class="text-right">
        <p class="text-[10px] sm:text-xs text-gray-500 font-mono uppercase tracking-wider">Stock Price</p>
        <p id="stock-price" class="font-mono text-xl sm:text-3xl font-bold text-white">$100.00</p>
      </div>
    </header>

    <!-- Portfolio stats -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3">
      <div class="stat-card col-span-1 sm:col-span-1 rounded-xl p-3 sm:p-4 border border-gray-800 bg-gray-900/80">
        <p class="text-[10px] sm:text-xs text-gray-500 font-mono uppercase tracking-wider mb-1">Portfolio Value</p>
        <p id="portfolio-value" class="font-mono text-3xl sm:text-5xl font-black neon-green transition-colors duration-300">$1,000.00</p>
      </div>
      <div class="stat-card rounded-xl p-3 sm:p-4 border border-gray-800 bg-gray-900/80">
        <p class="text-[10px] sm:text-xs text-gray-500 font-mono uppercase tracking-wider mb-1">Liquid Cash</p>
        <p id="liquid-cash" class="font-mono text-xl sm:text-2xl font-bold text-cyan-400">$1,000.00</p>
      </div>
      <div class="stat-card rounded-xl p-3 sm:p-4 border border-gray-800 bg-gray-900/80">
        <p class="text-[10px] sm:text-xs text-gray-500 font-mono uppercase tracking-wider mb-1">Total Shares</p>
        <p id="total-shares" class="font-mono text-xl sm:text-2xl font-bold text-purple-400">0</p>
      </div>
    </section>

    <!-- News ticker -->
    <div id="news-banner" class="news-banner relative overflow-hidden rounded-lg border border-yellow-500/40 bg-yellow-950/40 px-3 py-2 sm:py-3">
      <div class="flex items-center gap-2 sm:gap-3">
        <span class="flex-shrink-0 text-[10px] sm:text-xs font-black bg-red-600 text-white px-2 py-0.5 rounded animate-blink uppercase tracking-widest">BREAKING</span>
        <p id="news-text" class="text-xs sm:text-sm font-semibold text-yellow-300 truncate">Markets open. Brace for chaos...</p>
      </div>
    </div>

    <!-- Chart -->
    <section class="flex-1 min-h-[200px] sm:min-h-[280px]">
      <div id="chart-container" class="relative w-full h-full rounded-xl border border-gray-800 bg-black/60 overflow-hidden chart-glow">
        <canvas id="stock-chart" class="block w-full h-full"></canvas>
        <div id="trend-badge" class="absolute top-2 right-2 sm:top-3 sm:right-3 font-mono text-[10px] sm:text-xs px-2 py-1 rounded border border-gray-700 bg-gray-900/80 text-emerald-400">
          ▲ BULLISH
        </div>
      </div>
    </section>

    <!-- Trade buttons -->
    <section class="grid grid-cols-2 gap-3 sm:gap-4 pb-2">
      <div class="relative">
        <button id="buy-btn" class="trade-btn w-full py-5 sm:py-7 rounded-xl font-black text-base sm:text-xl tracking-wide bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-emerald-400/50 shadow-[0_0_25px_rgba(16,185,129,0.3)] transition-transform">
          BUY<br class="sm:hidden" />
          <span class="text-xs sm:text-sm font-normal opacity-80">(Go Long)</span>
        </button>
      </div>
      <div class="relative">
        <button id="sell-btn" class="trade-btn w-full py-5 sm:py-7 rounded-xl font-black text-base sm:text-xl tracking-wide bg-red-600 hover:bg-red-500 text-white border-2 border-red-400/50 shadow-[0_0_25px_rgba(239,68,68,0.3)] transition-transform">
          SELL<br class="sm:hidden" />
          <span class="text-xs sm:text-sm font-normal opacity-80">(Cash Out)</span>
        </button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
